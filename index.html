<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>#НЕБЕРУТЕЛЕФОН — Neptun</title>
<meta name="theme-color" content="#060607">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060607'/%3E%3Ctext x='32' y='48' font-size='46' text-anchor='middle' font-family='Georgia,serif' font-weight='700' fill='%23F1EEE6'%3EN%3C/text%3E%3Ccircle cx='53' cy='11' r='5' fill='%238DA2C4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Manrope:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#060607; --ivory:#F1EEE6; --steel:#8DA2C4; --dim:#6B7078; --line:rgba(241,238,230,.14);
  --serif:'Playfair Display','Didot','Bodoni 72',Georgia,'Times New Roman',serif;
  --sans:'Manrope','Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ivory);font-family:var(--sans);overflow-x:hidden;position:relative}
/* свет за курсором */
.spot{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(520px circle at var(--mx,50%) var(--my,35%),rgba(141,162,196,.13),transparent 65%)}
.grain{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.09;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at 50% 40%,transparent 50%,rgba(0,0,0,.7) 100%)}

.page{position:relative;z-index:2;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(18px,3vw,40px) clamp(18px,4vw,56px)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;font-size:clamp(.58rem,1vw,.74rem);letter-spacing:.3em;color:var(--dim)}
.brand{color:var(--ivory);font-weight:500;letter-spacing:.42em}
.brand sup{font-size:.7em;letter-spacing:0}
.top .r{text-align:right;line-height:1.9}

.side{position:fixed;top:50%;z-index:2;font-size:.6rem;letter-spacing:.34em;color:var(--dim);white-space:nowrap}
.side.l{left:clamp(6px,1.4vw,22px);transform:translateY(-50%) rotate(-90deg);transform-origin:left center;margin-left:.6rem}
.side.rr{right:clamp(6px,1.4vw,22px);transform:translateY(-50%) rotate(90deg);transform-origin:right center;margin-right:.6rem}
@media(max-width:720px){.side{display:none}}

.hero{align-self:center;text-align:center;padding:clamp(28px,6vh,70px) 0}
.ico{width:clamp(30px,3.6vw,44px);height:auto;color:var(--steel);margin-bottom:clamp(16px,3vh,30px);opacity:0;animation:fade 1.4s .2s forwards}
h1{margin:0;font-family:var(--serif);font-weight:500;line-height:.95;letter-spacing:-.015em;white-space:nowrap;
  font-size:clamp(1.55rem,8.1vw,8.2rem);color:var(--ivory);text-shadow:0 0 60px rgba(141,162,196,.22)}
h1 span{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(.25em);animation:letter 1.1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*70ms + 350ms)}
@keyframes letter{to{opacity:1;filter:none;transform:none}}
@keyframes fade{to{opacity:1}}
.sub{margin:clamp(18px,3.2vh,34px) 0 0;font-size:clamp(.62rem,1.2vw,.84rem);letter-spacing:.38em;color:var(--steel);opacity:0;animation:fade 1.4s 1.7s forwards}

.count{opacity:0;animation:fade 1.4s 2s forwards;width:min(920px,100%);margin:clamp(34px,7vh,80px) auto 0;border-top:1px solid var(--line);padding-top:clamp(18px,3vh,30px)}
.cap{font-size:clamp(.55rem,1vw,.72rem);letter-spacing:.34em;color:var(--dim);margin-bottom:clamp(14px,2.4vh,26px)}
.row{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1fr;align-items:center}
.cell{text-align:center}
.num{display:block;height:1.05em;overflow:hidden;font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,8.6vw,6.2rem);line-height:1.05;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum","tnum"}
.num b{display:block;font-weight:inherit}
.num.tick b{animation:roll .5s cubic-bezier(.2,.9,.25,1)}
@keyframes roll{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}
.u{display:block;margin-top:clamp(8px,1.4vh,14px);font-size:clamp(.5rem,.95vw,.7rem);letter-spacing:.3em;color:var(--dim)}
.dots{display:grid;gap:10px;padding:0 clamp(2px,1.6vw,18px);margin-bottom:1.6em}
.dots i{width:5px;height:5px;border-radius:50%;background:#4a4d54}
.dots i:nth-child(1){animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

.bar{width:min(920px,100%);margin:clamp(22px,4vh,40px) auto 0;height:1px;background:var(--line);position:relative}
.bar i{position:absolute;left:0;top:-1px;height:3px;width:0;background:linear-gradient(90deg,transparent,var(--steel));transition:width 1s linear}
.bar i::after{content:"";position:absolute;right:-3px;top:-2px;width:7px;height:7px;border-radius:50%;background:var(--ivory);box-shadow:0 0 14px 3px rgba(141,162,196,.9)}

.foot{text-align:center;font-size:clamp(.56rem,1vw,.74rem);letter-spacing:.26em;color:var(--dim);line-height:2.1;padding-top:clamp(16px,3vh,30px)}
.foot b{font-weight:500;color:var(--ivory);letter-spacing:.28em}
.foot .loc{color:var(--steel)}
.done h1{text-shadow:0 0 90px rgba(141,162,196,.5)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
</style>
</head>
<body>
<div class="spot" id="spot"></div><div class="vig"></div><div class="grain"></div>
<div class="side l">NEPTUN ® — MUSIC</div>
<div class="side rr" id="msk">MOSCOW 00:00:00</div>

<div class="page" id="app">
  <header class="top">
    <div class="brand">NEPTUN<sup>®</sup></div>
    <div class="r">НОВЫЙ СИНГЛ<br>2026</div>
  </header>

  <section class="hero">
    <svg class="ico" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M14 8h6l3 8-4 3a24 24 0 0 0 10 10l3-4 8 3v6a4 4 0 0 1-4 4A32 32 0 0 1 10 12a4 4 0 0 1 4-4z"/>
      <path d="M6 6l36 36"/>
    </svg>
    <h1 id="title" aria-label="#НЕБЕРУТЕЛЕФОН">#НЕБЕРУТЕЛЕФОН</h1>
    <p class="sub">НОВЫЙ СИНГЛ ОТ NEPTUN</p>

    <div class="count">
      <div class="cap" id="cap">ДО РЕЛИЗА</div>
      <div class="row">
        <div class="cell"><span class="num" id="d"><b>00</b></span><span class="u">ДНЕЙ</span></div>
        <div class="dots"><i></i><i></i></div>
        <div class="cell"><span class="num" id="h"><b>00</b></span><span class="u">ЧАСОВ</span></div>
        <div class="dots"><i></i><i></i></div>
        <div class="cell"><span class="num" id="m"><b>00</b></span><span class="u">МИНУТ</span></div>
        <div class="dots"><i></i><i></i></div>
        <div class="cell"><span class="num" id="s"><b>00</b></span><span class="u">СЕКУНД</span></div>
      </div>
    </div>
    <div class="bar"><i id="prog"></i></div>
  </section>

  <footer class="foot">
    <div><b>20 НОЯБРЯ</b> · 00:00 · ПО МОСКВЕ (UTC+3)</div>
    <div class="loc" id="loc"></div>
  </footer>
</div>

<script>
// Релиз: 20 ноября 2026, 00:00 по Москве (UTC+3). Поменяй тут, если сдвинется.
const TARGET = new Date('2026-11-20T00:00:00+03:00').getTime();
const START  = TARGET - 7*864e5;
const pad = n => String(n).padStart(2,'0');
const $ = id => document.getElementById(id);

// Заголовок по буквам
const t = $('title'), txt = t.textContent; t.textContent = '';
[...txt].forEach((ch,i)=>{ const s = document.createElement('span'); s.textContent = ch; s.style.setProperty('--i', i); s.setAttribute('aria-hidden','true'); t.appendChild(s); });

// Время для зрителя
try{
  $('loc').textContent = 'ПО ТВОЕМУ ВРЕМЕНИ: ' + new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}).format(TARGET).replace(',',' ·').toUpperCase();
}catch(e){}

const prev = {};
function set(k,v){
  const s = pad(v); if(prev[k] === s) return; prev[k] = s;
  const el = $(k); el.firstChild.textContent = s;
  el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick');
}
function clock(){
  try{ $('msk').textContent = 'MOSCOW ' + new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Moscow',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date()); }catch(e){}
}
function update(){
  const diff = Math.max(0, TARGET - Date.now()), sec = Math.floor(diff/1000);
  set('d', Math.floor(sec/86400)); set('h', Math.floor(sec%86400/3600));
  set('m', Math.floor(sec%3600/60)); set('s', sec%60);
  $('prog').style.width = Math.min(100, Math.max(0,(Date.now()-START)/(TARGET-START)*100)) + '%';
  clock();
  if(diff === 0){ $('app').classList.add('done'); $('cap').textContent = 'РЕЛИЗ УЖЕ ВЫШЕЛ'; return false; }
  return true;
}
(function loop(){ if(update()) setTimeout(loop, 250); })();

// Свет за курсором
addEventListener('pointermove', e => { const s = $('spot').style; s.setProperty('--mx', e.clientX+'px'); s.setProperty('--my', e.clientY+'px'); });
</script>
</body>
</html>
